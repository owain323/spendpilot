name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The same six gates a judge runs locally: pytest, sealed benchmark,
      # MCP roundtrip over the wire (a real client against a real server
      # subprocess), whole-repo SHA256 integrity manifest, evidence freshness
      # (evidence must not predate the code it describes), pure-English scan.
      - name: Run all quality gates
        run: python run_checks.py
